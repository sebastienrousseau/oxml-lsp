[package]
name = "oxml-lsp"
version = "0.0.6"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "XML diagnostics engine and linter, powered by oxml (LSP transport not yet implemented)"
repository = "https://github.com/sebastienrousseau/oxml-lsp"
homepage = "https://github.com/sebastienrousseau/oxml-lsp"
documentation = "https://docs.rs/oxml-lsp"
readme = "README.md"
keywords = ["xml", "lsp", "language-server", "diagnostics", "xsd"]
categories = ["development-tools", "text-editors"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

[lib]
name = "oxml_lsp"
path = "src/lib.rs"

[[bin]]
name = "oxml-lsp"
path = "src/main.rs"

[dependencies]
oxml = "0.0.6"

[lints.rust]
missing_docs = "warn"
unused_results = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[example]]
name = "library"
path = "examples/library.rs"

[[bench]]
name = "analyse"
path = "benches/analyse.rs"
harness = false
